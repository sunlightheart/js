<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            font-family: "Helvetica Neue", Arial, sans-serif;
            color: #eee;
        }

        .wrap {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 20px;
            letter-spacing: 2px;
        }

        canvas {
            background: #0f0f1e;
            border: 2px solid #444;
            display: block;
        }

        .side {
            width: 160px;
        }

        .panel {
            background: #24243e;
            border: 1px solid #3a3a5c;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .panel h2 {
            margin: 0 0 8px;
            font-size: 13px;
            color: #9a9ac0;
            letter-spacing: 1px;
        }

        .panel .value {
            font-size: 22px;
            font-weight: bold;
        }

        #next {
            background: #0f0f1e;
            border: 1px solid #3a3a5c;
        }

        .keys {
            font-size: 12px;
            line-height: 1.8;
            color: #b8b8d8;
        }

        .msg {
            margin-top: 8px;
            font-size: 13px;
            color: #ff6b6b;
            min-height: 18px;
        }

        button {
            width: 100%;
            padding: 8px;
            background: #4b4bce;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #5c5cdb;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div>
            <h1>TETRIS</h1>
            <canvas id="board" width="240" height="480"></canvas>
        </div>
        <div class="side">
            <div class="panel">
                <h2>NEXT</h2>
                <canvas id="next" width="120" height="120"></canvas>
            </div>
            <div class="panel">
                <h2>SCORE</h2>
                <div class="value" id="score">0</div>
            </div>
            <div class="panel">
                <h2>LINES</h2>
                <div class="value" id="lines">0</div>
            </div>
            <div class="panel">
                <h2>LEVEL</h2>
                <div class="value" id="level">1</div>
            </div>
            <div class="panel">
                <button id="startBtn">Start / Restart</button>
                <div class="msg" id="msg"></div>
            </div>
            <div class="panel keys">
                <div>&larr; &rarr; : Move</div>
                <div>&uarr; : Rotate</div>
                <div>&darr; : Soft drop</div>
                <div>Space : Hard drop</div>
                <div>P : Pause</div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var COLS = 12;
            var ROWS = 24;
            var BLOCK = 20;

            var canvas = document.getElementById('board');
            var ctx = canvas.getContext('2d');
            var nextCanvas = document.getElementById('next');
            var nextCtx = nextCanvas.getContext('2d');

            var scoreEl = document.getElementById('score');
            var linesEl = document.getElementById('lines');
            var levelEl = document.getElementById('level');
            var msgEl = document.getElementById('msg');
            var startBtn = document.getElementById('startBtn');

            var COLORS = {
                I: '#4dd0e1',
                J: '#4169e1',
                L: '#ffa726',
                O: '#ffee58',
                S: '#66bb6a',
                T: '#ab47bc',
                Z: '#ef5350'
            };

            var SHAPES = {
                I: [[0,1],[1,1],[2,1],[3,1]],
                J: [[0,0],[0,1],[1,1],[2,1]],
                L: [[2,0],[0,1],[1,1],[2,1]],
                O: [[0,0],[1,0],[0,1],[1,1]],
                S: [[1,0],[2,0],[0,1],[1,1]],
                T: [[1,0],[0,1],[1,1],[2,1]],
                Z: [[0,0],[1,0],[1,1],[2,1]]
            };

            var TYPES = Object.keys(SHAPES);

            var board, current, next, score, lines, level, dropInterval,
                dropTimer, running, paused, gameOver;

            function createBoard() {
                var b = [];
                for (var r = 0; r < ROWS; r++) {
                    b.push(new Array(COLS).fill(null));
                }
                return b;
            }

            function randomType() {
                return TYPES[Math.floor(Math.random() * TYPES.length)];
            }

            function makePiece(type) {
                var cells = SHAPES[type].map(function (c) {
                    return { x: c[0], y: c[1] };
                });
                return {
                    type: type,
                    cells: cells,
                    x: Math.floor(COLS / 2) - 2,
                    y: 0
                };
            }

            function rotatedCells(piece) {
                if (piece.type === 'O') {
                    return piece.cells.map(function (c) { return { x: c.x, y: c.y }; });
                }
                var size = piece.type === 'I' ? 4 : 3;
                return piece.cells.map(function (c) {
                    return { x: size - 1 - c.y, y: c.x };
                });
            }

            function collides(cells, offX, offY) {
                for (var i = 0; i < cells.length; i++) {
                    var x = current.x + cells[i].x + offX;
                    var y = current.y + cells[i].y + offY;
                    if (x < 0 || x >= COLS || y >= ROWS) return true;
                    if (y >= 0 && board[y][x]) return true;
                }
                return false;
            }

            function lockPiece() {
                for (var i = 0; i < current.cells.length; i++) {
                    var x = current.x + current.cells[i].x;
                    var y = current.y + current.cells[i].y;
                    if (y >= 0) board[y][x] = current.type;
                }
                clearLines();
                spawnPiece();
            }

            function clearLines() {
                var cleared = 0;
                for (var r = ROWS - 1; r >= 0; r--) {
                    if (board[r].every(function (cell) { return cell !== null; })) {
                        board.splice(r, 1);
                        board.unshift(new Array(COLS).fill(null));
                        cleared++;
                        r++;
                    }
                }
                if (cleared > 0) {
                    var points = [0, 100, 300, 500, 800][cleared] * level;
                    score += points;
                    lines += cleared;
                    level = 1 + Math.floor(lines / 10);
                    dropInterval = Math.max(100, 800 - (level - 1) * 70);
                    updateStats();
                }
            }

            function spawnPiece() {
                current = next || makePiece(randomType());
                next = makePiece(randomType());
                drawNext();
                if (collides(current.cells, 0, 0)) {
                    endGame();
                }
            }

            function move(dx) {
                if (!running || paused || gameOver) return;
                if (!collides(current.cells, dx, 0)) {
                    current.x += dx;
                    draw();
                }
            }

            function softDrop() {
                if (!running || paused || gameOver) return;
                if (!collides(current.cells, 0, 1)) {
                    current.y += 1;
                    score += 1;
                    updateStats();
                } else {
                    lockPiece();
                }
                draw();
            }

            function hardDrop() {
                if (!running || paused || gameOver) return;
                var dist = 0;
                while (!collides(current.cells, 0, 1)) {
                    current.y += 1;
                    dist++;
                }
                score += dist * 2;
                updateStats();
                lockPiece();
                draw();
            }

            function rotate() {
                if (!running || paused || gameOver) return;
                var rotated = rotatedCells(current);
                var kicks = [0, -1, 1, -2, 2];
                for (var i = 0; i < kicks.length; i++) {
                    if (!collides(rotated, kicks[i], 0)) {
                        current.cells = rotated;
                        current.x += kicks[i];
                        draw();
                        return;
                    }
                }
            }

            function updateStats() {
                scoreEl.textContent = score;
                linesEl.textContent = lines;
                levelEl.textContent = level;
            }

            function drawCell(context, x, y, color) {
                context.fillStyle = color;
                context.fillRect(x * BLOCK + 1, y * BLOCK + 1, BLOCK - 2, BLOCK - 2);
            }

            function draw() {
                ctx.fillStyle = '#0f0f1e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (var r = 0; r < ROWS; r++) {
                    for (var c = 0; c < COLS; c++) {
                        if (board[r][c]) {
                            drawCell(ctx, c, r, COLORS[board[r][c]]);
                        }
                    }
                }

                if (current) {
                    for (var i = 0; i < current.cells.length; i++) {
                        var x = current.x + current.cells[i].x;
                        var y = current.y + current.cells[i].y;
                        if (y >= 0) drawCell(ctx, x, y, COLORS[current.type]);
                    }
                }

                if (paused) {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
                }
            }

            function drawNext() {
                nextCtx.fillStyle = '#0f0f1e';
                nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
                if (!next) return;
                var block = 24;
                var offX = 1, offY = 1;
                for (var i = 0; i < next.cells.length; i++) {
                    var c = next.cells[i];
                    nextCtx.fillStyle = COLORS[next.type];
                    nextCtx.fillRect((c.x + offX) * block + 1, (c.y + offY) * block + 1, block - 2, block - 2);
                }
            }

            function tick() {
                if (!running || paused || gameOver) return;
                if (!collides(current.cells, 0, 1)) {
                    current.y += 1;
                } else {
                    lockPiece();
                }
                draw();
            }

            function loop() {
                if (!running) return;
                dropTimer += 16;
                if (dropTimer >= dropInterval) {
                    dropTimer = 0;
                    tick();
                }
                requestAnimationFrame(loop);
            }

            function endGame() {
                gameOver = true;
                running = false;
                msgEl.textContent = 'GAME OVER - Score: ' + score;
            }

            function togglePause() {
                if (!running || gameOver) return;
                paused = !paused;
                msgEl.textContent = paused ? 'PAUSED' : '';
                draw();
            }

            function startGame() {
                board = createBoard();
                score = 0;
                lines = 0;
                level = 1;
                dropInterval = 800;
                dropTimer = 0;
                running = true;
                paused = false;
                gameOver = false;
                msgEl.textContent = '';
                next = makePiece(randomType());
                spawnPiece();
                updateStats();
                draw();
                requestAnimationFrame(loop);
            }

            document.addEventListener('keydown', function (e) {
                switch (e.key) {
                    case 'ArrowLeft':
                        e.preventDefault();
                        move(-1);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        move(1);
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        softDrop();
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        rotate();
                        break;
                    case ' ':
                        e.preventDefault();
                        hardDrop();
                        break;
                    case 'p':
                    case 'P':
                        togglePause();
                        break;
                }
            });

            startBtn.addEventListener('click', startGame);

            board = createBoard();
            draw();
            drawNext();
        })();
    </script>
</body>
</html>
