<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff4d1f">

    <link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

    <title>熱血アラーム</title>

    <style>
      :root {
        --bg: #faf5ec;
        --surface: #fffaf2;
        --surface-2: #f2e6d3;
        --ink: #1f160f;
        --ink-soft: #7a6a58;
        --accent: #ff4d1f;
        --accent-strong: #e63c00;
        --gold: #b8770a;
        --border: rgba(31, 22, 15, 0.13);
        --shadow: rgba(31, 22, 15, 0.10);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #15100c;
          --surface: #201811;
          --surface-2: #2b2018;
          --ink: #f7ece0;
          --ink-soft: #b8a58e;
          --accent: #ff6a3d;
          --accent-strong: #ff8a5c;
          --gold: #ffc94d;
          --border: rgba(247, 236, 224, 0.14);
          --shadow: rgba(0, 0, 0, 0.4);
        }
      }

      :root[data-theme="dark"] {
        --bg: #15100c;
        --surface: #201811;
        --surface-2: #2b2018;
        --ink: #f7ece0;
        --ink-soft: #b8a58e;
        --accent: #ff6a3d;
        --accent-strong: #ff8a5c;
        --gold: #ffc94d;
        --border: rgba(247, 236, 224, 0.14);
        --shadow: rgba(0, 0, 0, 0.4);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .app {
        max-width: 460px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ---------- Hero / clock ---------- */

      .hero {
        position: relative;
        overflow: hidden;
        padding: 44px 28px 34px;
        background: linear-gradient(160deg, var(--accent) 0%, var(--accent-strong) 55%, #a8280a 100%);
        color: #fff8ef;
        text-align: center;
      }

      .hero-glow {
        position: absolute;
        inset: -40% -20% auto -20%;
        height: 220px;
        background: radial-gradient(closest-side, rgba(255, 214, 130, 0.55), transparent 70%);
        filter: blur(10px);
        pointer-events: none;
      }

      .eyebrow {
        position: relative;
        margin: 0 0 14px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.28em;
        color: rgba(255, 248, 239, 0.75);
      }

      .clock {
        position: relative;
        font-family: 'RocknRoll One', 'Zen Kaku Gothic New', sans-serif;
        font-size: clamp(48px, 14vw, 64px);
        line-height: 1;
        font-variant-numeric: tabular-nums;
        text-wrap: balance;
      }

      .date {
        position: relative;
        margin-top: 10px;
        font-size: 14px;
        color: rgba(255, 248, 239, 0.82);
        letter-spacing: 0.04em;
      }

      /* ---------- Content ---------- */

      .content {
        flex: 1;
        padding: 26px 20px 40px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .section-head h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: var(--ink-soft);
      }

      .alarm-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .alarm-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 1px 2px var(--shadow);
      }

      .alarm-time {
        font-family: 'RocknRoll One', sans-serif;
        font-size: 30px;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .alarm-time.muted {
        color: var(--ink-soft);
      }

      .alarm-label {
        margin-top: 5px;
        font-size: 12px;
        color: var(--ink-soft);
        letter-spacing: 0.04em;
      }

      .alarm-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .toggle {
        position: relative;
        width: 46px;
        height: 27px;
        display: inline-block;
      }

      .toggle input {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        cursor: pointer;
      }

      .toggle-track {
        position: absolute;
        inset: 0;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 20px;
        transition: background-color 0.18s ease;
      }

      .toggle-track::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 21px;
        height: 21px;
        border-radius: 50%;
        background: #fff8ef;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        transition: transform 0.18s ease;
      }

      .toggle input:checked + .toggle-track {
        background: var(--accent);
        border-color: var(--accent);
      }

      .toggle input:checked + .toggle-track::before {
        transform: translateX(19px);
      }

      .toggle input:focus-visible + .toggle-track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .icon-btn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--ink-soft);
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-btn:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .icon-btn:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .empty {
        color: var(--ink-soft);
        font-size: 14px;
        text-align: center;
        padding: 22px 0;
        border: 1px dashed var(--border);
        border-radius: 14px;
      }

      .add-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .add-card input[type="time"] {
        flex: 1;
        min-width: 0;
        font-family: 'RocknRoll One', sans-serif;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--ink);
      }

      .btn-accent {
        flex-shrink: 0;
        background: var(--accent);
        color: #fff8ef;
        border: none;
        border-radius: 10px;
        padding: 13px 20px;
        font-family: 'Zen Kaku Gothic New', sans-serif;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
      }

      .btn-accent:hover {
        background: var(--accent-strong);
      }

      .disclaimer {
        margin: 0;
        font-size: 11.5px;
        line-height: 1.6;
        color: var(--ink-soft);
        text-align: center;
        padding: 0 6px;
      }

      /* ---------- Ring takeover ---------- */

      .ring {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: radial-gradient(120% 100% at 50% 0%, #ff8a3d 0%, #ff4d1f 45%, #b8270b 100%);
        color: #fff8ef;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        text-align: center;
        overflow: hidden;
      }

      .ring.show {
        display: flex;
      }

      .ring-rays {
        position: absolute;
        width: 900px;
        height: 900px;
        background: repeating-conic-gradient(from 0deg, rgba(255, 226, 158, 0.16) 0deg 6deg, transparent 6deg 18deg);
        animation: spin 40s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .ring-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 380px;
      }

      .ring-time {
        font-family: 'RocknRoll One', sans-serif;
        font-size: 40px;
        font-variant-numeric: tabular-nums;
        opacity: 0.9;
        margin-bottom: 18px;
        animation: pulse 1.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }

      .ring-quote {
        font-family: 'RocknRoll One', sans-serif;
        font-size: clamp(26px, 7.5vw, 34px);
        line-height: 1.45;
        text-wrap: balance;
        margin: 0 0 14px;
      }

      .ring-credit {
        margin: 0 0 36px;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #ffe2b0;
      }

      .ring-actions {
        display: flex;
        gap: 14px;
        width: 100%;
      }

      .ring-actions button {
        flex: 1;
        padding: 16px;
        border-radius: 12px;
        border: none;
        font-family: 'Zen Kaku Gothic New', sans-serif;
        font-weight: 900;
        font-size: 16px;
        cursor: pointer;
      }

      .btn-ghost {
        background: rgba(255, 248, 239, 0.16);
        color: #fff8ef;
        border: 1px solid rgba(255, 248, 239, 0.4) !important;
      }

      .btn-solid {
        background: #fff8ef;
        color: #c23000;
      }

      @media (prefers-reduced-motion: reduce) {
        .ring-rays { animation: none; }
        .ring-time { animation: none; }
      }
    </style>
</head>
<body>
    <div class="app">
        <div class="hero">
            <div class="hero-glow" aria-hidden="true"></div>
            <p class="eyebrow">GOOD MORNING</p>
            <div class="clock" id="nowClock">00:00:00</div>
            <div class="date" id="nowDate">----年--月--日</div>
        </div>

        <main class="content">
            <section>
                <div class="section-head"><h2>アラーム</h2></div>
                <div class="alarm-list" id="alarmList"></div>
            </section>

            <section>
                <div class="section-head"><h2>追加する</h2></div>
                <div class="add-card">
                    <input type="time" id="newTime" value="06:30" aria-label="アラーム時刻">
                    <button id="addBtn" class="btn-accent">追加</button>
                </div>
            </section>

            <p class="disclaimer">名言は松岡修造さんの語録をモチーフにしたファン制作の非公式サンプルです。目を覚ますモチベーション演出としてお楽しみください。<br>ブラウザのタブを開いたままにしておくと鳴動します。ホーム画面に追加してご利用ください。</p>
        </main>

        <div class="ring" id="ringOverlay" role="alertdialog" aria-modal="true" aria-hidden="true">
            <div class="ring-rays" aria-hidden="true"></div>
            <div class="ring-inner">
                <div class="ring-time" id="ringTime">06:30</div>
                <p class="ring-quote" id="ringQuote">起きた瞬間から、もう試合は始まってるんだよ！</p>
                <p class="ring-credit">熱血格言（非公式）</p>
                <div class="ring-actions">
                    <button id="snoozeBtn" class="btn-ghost">あと5分</button>
                    <button id="stopBtn" class="btn-solid">起きる！</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var QUOTES = [
            '「疲れた」とか「無理」とか言ってる時間があったら、その分をどう使うか考えろ！',
            '限界を作ってるのは、自分自身だよ。可能性を信じろ！',
            '明日やろうは、バカ野郎！',
            '太陽は、また昇る！！',
            '熱くなれよ！人生は一度きりなんだから！',
            '今できる、目の前のことを、一生懸命やるんだよ！',
            'まだ朝だぞ！これからだろ！',
            '起きた瞬間から、もう試合は始まってるんだよ！',
            'できない理由を探すより、できる方法を考えろ！',
            '一日は待ってくれない。今すぐ動け！',
            '諦めるのは、まだ早い！さあ、布団から出よう！',
            '昨日の自分を超えていくのは、今日の自分だ！'
        ];

        var STORAGE_KEY = 'nekketsu_alarms';
        var alarms = [];
        var audioCtx = null;
        var oscillator = null;
        var gainNode = null;
        var ringingAlarmId = null;
        var lastCheckedMinute = null;

        function loadAlarms(){
            try{
                var raw = localStorage.getItem(STORAGE_KEY);
                alarms = raw ? JSON.parse(raw) : [];
            }catch(e){
                alarms = [];
            }
        }

        function saveAlarms(){
            try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(alarms)); }catch(e){}
        }

        function pad(n){
            return n < 10 ? '0' + n : '' + n;
        }

        function renderClock(){
            var now = new Date();
            document.getElementById('nowClock').textContent =
                pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
            document.getElementById('nowDate').textContent =
                now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
        }

        function renderAlarms(){
            var list = document.getElementById('alarmList');
            list.innerHTML = '';

            if(alarms.length === 0){
                var empty = document.createElement('div');
                empty.className = 'empty';
                empty.textContent = 'まだアラームがありません';
                list.appendChild(empty);
                return;
            }

            var sorted = alarms.slice().sort(function(a, b){
                return a.time.localeCompare(b.time);
            });

            sorted.forEach(function(alarm){
                var card = document.createElement('div');
                card.className = 'alarm-card';

                var info = document.createElement('div');
                var time = document.createElement('div');
                time.className = 'alarm-time' + (alarm.enabled ? '' : ' muted');
                time.textContent = alarm.time;
                var label = document.createElement('div');
                label.className = 'alarm-label';
                label.textContent = alarm.enabled ? '有効' : '無効';
                info.appendChild(time);
                info.appendChild(label);

                var actions = document.createElement('div');
                actions.className = 'alarm-actions';

                var toggleLabel = document.createElement('label');
                toggleLabel.className = 'toggle';
                var checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = alarm.enabled;
                checkbox.setAttribute('aria-label', alarm.time + 'のアラームを' + (alarm.enabled ? '無効化' : '有効化'));
                checkbox.addEventListener('change', function(){
                    alarm.enabled = checkbox.checked;
                    saveAlarms();
                    renderAlarms();
                });
                var track = document.createElement('span');
                track.className = 'toggle-track';
                toggleLabel.appendChild(checkbox);
                toggleLabel.appendChild(track);

                var delBtn = document.createElement('button');
                delBtn.className = 'icon-btn';
                delBtn.textContent = '✕';
                delBtn.setAttribute('aria-label', alarm.time + 'のアラームを削除');
                delBtn.addEventListener('click', function(){
                    alarms = alarms.filter(function(a){ return a.id !== alarm.id; });
                    saveAlarms();
                    renderAlarms();
                });

                actions.appendChild(toggleLabel);
                actions.appendChild(delBtn);

                card.appendChild(info);
                card.appendChild(actions);
                list.appendChild(card);
            });
        }

        function addAlarm(){
            var input = document.getElementById('newTime');
            if(!input.value) return;

            alarms.push({
                id: Date.now(),
                time: input.value,
                enabled: true
            });
            saveAlarms();
            renderAlarms();
        }

        function randomQuote(){
            return QUOTES[Math.floor(Math.random() * QUOTES.length)];
        }

        function unlockAudio(){
            if(audioCtx) return;
            try{
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }catch(e){
                audioCtx = null;
            }
        }

        function startBeep(){
            if(!audioCtx) unlockAudio();
            if(!audioCtx) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();

            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            oscillator.type = 'square';
            oscillator.frequency.value = 880;
            gainNode.gain.value = 0.15;
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }

        function stopBeep(){
            if(oscillator){
                try{ oscillator.stop(); }catch(e){}
                oscillator.disconnect();
                oscillator = null;
            }
            if(gainNode){
                gainNode.disconnect();
                gainNode = null;
            }
        }

        function ring(alarm){
            ringingAlarmId = alarm.id;
            document.getElementById('ringTime').textContent = alarm.time;
            document.getElementById('ringQuote').textContent = randomQuote();
            var overlay = document.getElementById('ringOverlay');
            overlay.classList.add('show');
            overlay.setAttribute('aria-hidden', 'false');
            startBeep();
        }

        function stopRing(disable){
            stopBeep();
            var overlay = document.getElementById('ringOverlay');
            overlay.classList.remove('show');
            overlay.setAttribute('aria-hidden', 'true');

            var alarm = alarms.find(function(a){ return a.id === ringingAlarmId; });
            if(alarm && disable){
                alarm.enabled = false;
                saveAlarms();
                renderAlarms();
            }
            ringingAlarmId = null;
        }

        function snooze(){
            var alarm = alarms.find(function(a){ return a.id === ringingAlarmId; });
            stopBeep();
            var overlay = document.getElementById('ringOverlay');
            overlay.classList.remove('show');
            overlay.setAttribute('aria-hidden', 'true');

            if(alarm){
                var next = new Date();
                next.setMinutes(next.getMinutes() + 5);
                alarm.time = pad(next.getHours()) + ':' + pad(next.getMinutes());
                saveAlarms();
                renderAlarms();
            }
            ringingAlarmId = null;
        }

        function checkAlarms(){
            if(ringingAlarmId !== null) return;

            var now = new Date();
            var current = pad(now.getHours()) + ':' + pad(now.getMinutes());

            if(current === lastCheckedMinute) return;
            lastCheckedMinute = current;

            var match = alarms.find(function(a){ return a.enabled && a.time === current; });
            if(match) ring(match);
        }

        document.getElementById('addBtn').addEventListener('click', addAlarm);
        document.getElementById('stopBtn').addEventListener('click', function(){ stopRing(true); });
        document.getElementById('snoozeBtn').addEventListener('click', snooze);
        document.addEventListener('pointerdown', unlockAudio, { once: true });

        loadAlarms();
        renderAlarms();
        renderClock();
        setInterval(renderClock, 1000);
        setInterval(checkAlarms, 1000);
    </script>
</body>
</html>
