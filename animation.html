<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans+Condensed:wght@300&display=swap" rel="stylesheet">

    <title>Animation</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            background-color: rgba(26, 55, 229, 0.06);
            font-family: 'Open Sans Condensed', sans-serif;
        }

        header{
            background-color: #007acc;
            color: #fff;
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 100;
        }

        header h1{
            margin: 0;
            font-size: 25px;
            padding: 5px;
            text-align: center;
        }

        .container{
            max-width: 600px;
            margin: 0 auto;
            padding: 80px 20px 40px;
            box-sizing: border-box;
        }

        .card{
            background: #fff;
            border-radius: 8px;
            box-shadow: 0px 0px 3px rgba(0, 0, 0, .3);
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h2{
            margin-top: 0;
            font-size: 18px;
            color: #007acc;
        }

        /* --- 1. bounce (pure CSS keyframes) --- */
        .stage{
            position: relative;
            height: 100px;
        }

        .ball{
            position: absolute;
            left: 0;
            bottom: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #007acc;
            animation: bounce 1.2s ease-in-out infinite;
        }

        @keyframes bounce{
            0%, 100%{
                transform: translateY(0);
            }
            50%{
                transform: translateY(-60px);
            }
        }

        /* --- 2. spinner (pure CSS rotation) --- */
        .spinner{
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border: 4px solid rgba(0, 122, 204, .2);
            border-top-color: #007acc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin{
            to{
                transform: rotate(360deg);
            }
        }

        /* --- 3. click-triggered animation (JS toggles a class) --- */
        .box{
            width: 60px;
            height: 60px;
            background: #007acc;
            margin: 0 auto;
            border-radius: 6px;
            transition: transform 0.5s ease, background-color 0.5s ease;
        }

        .box.spin{
            transform: rotate(180deg) scale(1.4);
            background-color: #ff7a00;
        }

        button{
            display: block;
            margin: 16px auto 0;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #007acc;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover{
            background: #005a99;
        }
    </style>
</head>
<body>
    <header>
        <h1>Animation Samples</h1>
    </header>

    <div class="container">
        <div class="card">
            <h2>1. Bounce (CSS @keyframes)</h2>
            <div class="stage">
                <div class="ball"></div>
            </div>
        </div>

        <div class="card">
            <h2>2. Spinner (CSS rotate)</h2>
            <div class="spinner"></div>
        </div>

        <div class="card">
            <h2>3. Click to animate (JS class toggle)</h2>
            <div class="box" id="box"></div>
            <button id="trigger">Animate</button>
        </div>
    </div>

    <script>
        document.getElementById('trigger').addEventListener('click', function(){
            document.getElementById('box').classList.toggle('spin');
        });
    </script>
</body>
</html>
